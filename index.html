function score(x){const w=+x.w||0;if(w>0&&!(x.eqL))return x.s.reduce((a,r)=>a+w*(1+r/30),0)/x.s.length;return x.s.reduce((a,r)=>a+r,0);}

function cmpS(c,p){const w=+c.x.w||0,pw=+p.x.w||0;if(w>pw)return "up";if(w<pw)return "down";const t=c.x.s.reduce((a,b)=>a+b,0),pt=p.x.s.reduce((a,b)=>a+b,0);return t>pt?"up":t<pt?"down":"eq";}
function status(id){const se=series(id);if(!se.length)return "none";if(se.length<2)return "nouveau";
  const n=se.length,last=cmpS(se[n-1],se[n-2]);if(last==="up")return "prog";
  let k=0;for(let i=n-1;i>0;i--){if(cmpS(se[i],se[i-1])==="up")break;k++;}
  if(k>=3)return "stag";if(last==="down")return "regr";return "stable";}
const perfTxt=(id,x)=>{const e=EX[id];return `${e.eq==="lest"&&!(+x.w)?"PDC":num(+x.w)+" kg"} × ${x.s.join("-")}${x.rir!=null?` · RIR ${x.rir>=4?"4+":x.rir}`:""}`;};

/* ---------- Assiduité ---------- */
function startDate(){if(S.config.start)return S.config.start;const ds=Object.keys(S.seances).sort();return ds[0]||today();}
function plannedDays(from,to){const out=[];let d=from;while(d<=to){if(progOf(d))out.push(d);d=addDays(d,1);}return out;}
function assid(){const st=startDate(),td=today(),days=plannedDays(st,td);let fait=0,manq=0,nr=0,afaire=0;
  const cell={};
  days.forEach(d=>{const r=S.seances[d];
    if(r&&r.done===true){fait++;cell[d]="ok";}else if(r&&r.done===false){manq++;cell[d]="ko";}else if(d===td){afaire++;cell[d]="todo";}else{nr++;cell[d]="nr";}});
  const extra=Object.values(S.seances).filter(r=>r.done===true&&!progOf(r.date)).length;
  const elapsed=days.length-afaire;
  let streak=0;for(let i=days.length-1;i>=0;i--){const c=cell[days[i]];if(c==="todo")continue;if(c==="ok")streak++;else break;}
  return {st,days,fait,manq,nr,afaire,extra,elapsed,taux:elapsed?Math.round(100*fait/elapsed):null,streak,cell};}
function pendingDays(){const a=assid();return a.days.filter(d=>a.cell[d]==="nr");}

/* ---------- Vue Séance ---------- */
function loadDraft(date){S.date=date;const r=S.seances[date];
  S.draft=r?structuredClone(r):{date,prog:progOf(date)||nextProg(date),done:null,reason:null,ex:{},note:""};
  if(!S.draft.ex)S.draft.ex={};S.dirty=false;}
function nextProg(date){let d=date;for(let i=0;i<7;i++){if(progOf(d))return progOf(d);d=addDays(d,1);}return "lun";}
function stepPlanned(date,dir){let d=addDays(date,dir);for(let i=0;i<8;i++){if(progOf(d))return d;d=addDays(d,dir);}return d;}

  h+=`<section class="card"><div class="lbl">Programme</div><div class="seg">${Object.keys(PROG).map(k=>`<button data-prog="${k}" class="${D.prog===k?"on":""}">${PROG[k].label}</button>`).join("")}</div>
  ${!planned?`<p class="hint">Pas de séance prévue ce jour. Si tu rattrapes une séance, choisis laquelle.</p>`:planned!==D.prog?`<p class="hint">Ce jour est normalement un ${PROG[planned].label.toLowerCase()} : tu fais une autre séance.</p>`:""}
  <div class="lbl" style="margin-top:14px">Tu t’es entraîné ?</div><div class="seg yn"><button data-done="1" class="${D.done===true?"on yes":""}">Oui</button><button data-done="0" class="${D.done===false?"on no":""}">Non</button></div></section>`;
  if(D.done===false){const R=["Fatigue","Malade / blessé","Travail / cours","Pas motivé","Imprévu","Autre"];
    h+=`<section class="card"><div class="lbl">Pourquoi ?</div><div class="chips">${R.map(r=>`<button class="chip ${D.reason===r?"on":""}" data-reason="${r}">${r}</button>`).join("")}</div>
    <textarea data-note placeholder="Un mot pour plus tard (facultatif)">${esc(D.note)}</textarea><p class="hint">Séance comptée comme manquée dans ton assiduité. Les cibles restent les mêmes pour la prochaine fois.</p></section>`;}
  if(D.done===true){const P=curProg()[D.prog];
    h+=`<p class="mode ${S.config.volume==="max"?"max":""}">${S.config.volume==="max"?"Volume maximal":"Volume standard"} · ${P.items.length} exercices + ${P.abs.length} abdos</p><p class="hint pad">Échauffe-toi avant le 1er exercice : 1 ou 2 séries légères (≈50 % puis 75 % de la charge), non notées. La cible est pré-remplie : corrige la charge si tu as mis autre chose, puis note tes reps.</p>`;

    h+=`<section class="card"><div class="lbl">Note de séance</div><textarea data-note placeholder="Sensations, douleur, matériel pris…">${esc(D.note)}</textarea></section>`;}

function exCard(id,n){const e=EX[id],D=S.draft,x=D.ex[id]||{},T=target(id,D.date),[mn,mx]=e.r;
  const wv=x.w!=null?x.w:(T.w!=null?T.w:"");const tr=T.reps||[];
  const unit=e.uni?` <span class="u">${e.uni}</span>`:"";
  const wl=e.eq==="lest"?"Lest (kg, 0 = sans)":`Charge (kg${e.w?", "+e.w:""})`;

  <div class="why">${T.why}</div>${T.last?`<div class="last">Dernière fois (${fd(T.last.date)}) : ${perfTxt(id,T.last)}</div>`:""}${S.config.reglages[id]?`<div class="last">Mon réglage : ${esc(S.config.reglages[id])}</div>`:""}</div>

  <div class="sets">${[0,1,2].map(i=>`<label><span>Série ${i+1}</span><input type="number" inputmode="numeric" min="0" max="60" data-f="s${i}" placeholder="${tr[i]||""}" value="${x.s&&x.s[i]!=null?x.s[i]:""}"></label>`).join("")}</div></div>
  <div class="rir"><span>RIR dernière série</span>${[0,1,2,3,4].map(r=>`<button data-rir="${r}" class="${x.rir===r?"on":""}">${r===4?"4+":r}</button>`).join("")}</div>
  <div class="exf"><label class="skip"><input type="checkbox" data-f="skip" ${x.skip?"checked":""}> Pas fait aujourd’hui</label><span class="cmp"></span></div></section>`;}
function readCard(card){const id=card.dataset.id,D=S.draft,x=D.ex[id]||{};
  const w=$("[data-f=w]",card).value;x.w=w===""?null:+w;
  x.s=[0,1,2].map(i=>{const v=$(`[data-f=s${i}]`,card).value;return v===""?null:+v;});
  x.skip=$("[data-f=skip]",card).checked;D.ex[id]=x;card.classList.toggle("skipped",x.skip);updCmp(id);saveDraftSoon();}
function updCmp(id){const card=$(`.ex[data-id="${id}"]`);if(!card)return;const el=$(".cmp",card),x=S.draft.ex[id];
  if(!x||!complete(x)){el.innerHTML="";return;}
  const T=target(id,S.draft.date),h=hist(id,S.draft.date);let out=[];
  if(T.reps&&(+x.w||0)===(+T.w||0)){out.push(x.s.every((r,i)=>r>=T.reps[i])?`<b class="g">✓ Cible atteinte</b>`:`<span class="m">Cible ratée de ${T.reps.reduce((a,r,i)=>a+Math.max(0,r-x.s[i]),0)} rep(s)</span>`);}
  if(h.length){const L=h[0].ex[id];if((+L.w||0)===(+x.w||0)){const dlt=x.s.reduce((a,b)=>a+b,0)-L.s.reduce((a,b)=>a+b,0);
    out.push(dlt>0?`<b class="g">↗ +${dlt} rep${dlt>1?"s":""}</b>`:dlt===0?`<span class="m">→ même total</span>`:`<b class="r">↘ ${dlt} rep${dlt<-1?"s":""}</b>`);}
    else out.push((+x.w||0)>(+L.w||0)?`<b class="g">↑ charge +${num((+x.w||0)-(+L.w||0))} kg</b>`:`<span class="m">↓ charge plus légère</span>`);}
  if(x.rir==null)out.push(`<span class="m">Note le RIR</span>`);
  el.innerHTML=out.join(" · ");}

function thumb(id,big){return id in ILL?`<img class="th" src="${id}-2.webp" alt="" loading="lazy">`:`<svg class="th ill" viewBox="0 -35 240 212">${illustration(id,1,{ghost:false,arrow:false})}</svg>`;}

  let h=`<p class="mode ${isMax?"max":""}">${isMax?"Volume maximal activé · ≈1 h 30 par séance":"Volume standard · ≈1 h 15 par séance"} · <button class="lnk in" data-nav="reglages">changer</button></p><div class="seg big">${Object.keys(PROG).map(j=>`<button data-ptab="${j}" class="${k===j?"on":""}">${PROG[j].label}</button>`).join("")}<button data-ptab="muscle" class="${k==="muscle"?"on":""}">Par muscle</button></div>`;

  if(k==="muscle"){const all=[];for(const d in G)for(const id of [...G[d].items,...G[d].abs])if(!all.includes(id))all.push(id);
    h+=`<p class="hint pad">Pour chaque muscle, les exercices de ton programme qui le travaillent en priorité, et ceux qui l’aident.</p>`;
    for(const m in MUSCLES){const pri=all.filter(id=>EX[id].main.includes(m)),sec=all.filter(id=>EX[id].sec.includes(m));if(!pri.length&&!sec.length)continue;
      h+=`<section class="card"><h3>${MUSCLES[m]}</h3>${pri.length?`<div class="pgrid">${pri.map(id=>card(id)).join("")}</div>`:`<p class="hint warnt">Aucun exercice ciblé en priorité : seulement en secondaire.</p>`}
      ${sec.length?`<p class="hint">Travaillé aussi par : ${sec.map(id=>`<button class="lnk in" data-fiche="${id}">${EX[id].short}</button>`).join(", ")}</p>`:""}
      <p class="hint">Jours : ${Object.keys(PROG).filter(d=>[...pri,...sec].some(id=>DAYS_OF(G,id).includes(d))).map(d=>PROG[d].label).join(", ")}</p></section>`;}
    return h;}
  const P=G[k];
  h+=`<div class="pgrid">${P.items.map((id,i)=>card(id,i+1)).join("")}</div><h3 class="sec">Abdos · fin de séance</h3><div class="pgrid">${P.abs.map((id,i)=>card(id,"A"+(i+1))).join("")}</div>`;
  h+=`<section class="card"><h3>Règles de progression</h3><ul class="rules">
  <li><b>3 séries</b> par exercice, chacune au maximum de reps propres, en gardant 1 à 2 reps en réserve. Les reps baissent souvent d’une série à l’autre (11-10-8), c’est normal.</li>
  <li>Tu notes le <b>RIR de la dernière série</b> : RIR 3+ → +2 reps visées, RIR 1–2 → +1 rep, RIR 0 → mêmes reps et +1 sur la série la plus faible.</li>
  <li>Dès que tu fais <b>12-12-12</b>, charge supérieure et retour à <b>8</b> reps (abdos au poids du corps : 10 → 15).</li>
  <li>Si, juste après une montée, une série tombe <b>sous 6 reps</b> : retour à l’ancienne charge.</li>
  <li><b>Stagnation</b> = 3 séances d’affilée sans plus de charge ni plus de reps. Solution : une semaine plus légère (−10 %) ou une variante proche.</li></ul></section>`;
  h+=`<section class="card"><h3>Volume par semaine</h3><p class="hint">Séries par zone, les séries indirectes comptées pour moitié (méthode de Pelland et al.).</p><table class="tbl"><tbody>
  ${VOL[isMax?"max":"base"].map(r=>`<tr><td>${r[0]}</td><td class="rt">${r[1]}</td></tr>`).join("")}</tbody></table></section>`;
  return h;}

  const ids=allEx(),st={};ids.forEach(id=>st[id]=status(id));
  const cnt=k=>ids.filter(id=>st[id]===k).length;
  const F=[["all","Tous",ids.length],["prog","Progression",cnt("prog")],["stable","Stable",cnt("stable")],["stag","Stagnation",cnt("stag")],["regr","Régression",cnt("regr")]];
  h+=`<section class="card"><h3>Performance par exercice</h3><div class="chips">${F.map(f=>`<button class="chip ${S.filt===f[0]?"on":""}" data-filt="${f[0]}">${f[1]} <b>${f[2]}</b></button>`).join("")}</div>`;
  const shown=ids.filter(id=>S.filt==="all"||st[id]===S.filt);
  h+=shown.length?`<div class="plist">${shown.map(id=>{const se=series(id),s=STAT[st[id]];return `<button class="perf" data-perf="${id}"><span class="pn"><b>${EX[id].short}</b><small>${se.length?perfTxt(id,se[se.length-1].x)+" · "+fd(se[se.length-1].date):"Aucune donnée"}</small></span><span class="sp" data-spark="${id}"></span><span class="st ${s[2]}">${s[0]} ${s[1]}</span></button>`;}).join("")}</div>`:`<p class="hint">Aucun exercice dans cette catégorie.</p>`;
  h+=`<p class="hint">Statut : on compare chaque séance à la précédente. Charge plus lourde ou plus de reps à charge égale = progression. Stagnation = 3 séances d’affilée sans progresser. La courbe montre ta force estimée (1RM, formule d’Epley).</p></section>`;
  return h;}
function calendar(A){const td=today();let mon=A.st;while(pd(mon).getDay()!==1)mon=addDays(mon,-1);
  let weeks=[];let w=mon;const end=addDays(td,7);while(w<=end){weeks.push(w);w=addDays(w,7);}weeks=weeks.slice(-12);
  const lab={ok:"Faite",ko:"Manquée",nr:"Non renseignée",todo:"Aujourd’hui",fut:"À venir",pre:"Avant le début"};
  return `<div class="cal"><div class="ch"><span></span><span>Lun</span><span>Mer</span><span>Ven</span></div>${weeks.map(wk=>`<div class="cw"><span class="wl">${fds(wk)}</span>${[0,2,4].map(o=>{const d=addDays(wk,o);const c=d<A.st?"pre":d>td?"fut":A.cell[d]||"fut";
  return `<button class="cc ${c}" data-goto="${d}" title="${fd(d)} · ${lab[c]}"><span>${pd(d).getDate()}</span>${c==="ok"?"✓":c==="ko"?"✕":c==="nr"?"?":""}</button>`;}).join("")}</div>`).join("")}</div>
  <div class="legend"><span><i class="cc ok"></i>Faite</span><span><i class="cc ko"></i>Manquée</span><span><i class="cc nr"></i>Non renseignée</span><span><i class="cc fut"></i>À venir</span></div>`;}
function spark(id){const se=series(id);if(se.length<2)return "";const v=se.map(p=>p.sc),mn=Math.min(...v),mx=Math.max(...v),W=70,H=24;
  const pts=v.map((y,i)=>`${f1(i*(W-4)/(v.length-1)+2)},${f1(H-3-(mx===mn?.5:(y-mn)/(mx-mn))*(H-6))}`);
  return `<svg viewBox="0 0 ${W} ${H}" class="spk"><polyline points="${pts.join(" ")}"/><circle cx="${pts[pts.length-1].split(",")[0]}" cy="${pts[pts.length-1].split(",")[1]}" r="2.5"/></svg>`;}
function openPerf(id){const e=EX[id],se=series(id),s=STAT[status(id)];
  const isLest=e.eq==="lest";
  let h=`<h2>${e.short}</h2><div class="tags"><i class="st ${s[2]}">${s[0]} ${s[1]}</i><i class="t0">${se.length} séance${se.length>1?"s":""}</i></div>`;
  if(s[1]==="Stagnation")h+=`<p class="adv">3 séances d’affilée sans progresser. Fais une semaine à −10 % de charge en gardant les mêmes reps, ou remplace par une variante proche (autre prise, autre machine) pendant 4 à 6 semaines.</p>`;
  if(s[1]==="Régression")h+=`<p class="adv">Baisse par rapport à la dernière fois. Une mauvaise séance arrive : regarde ton sommeil, ce que tu as mangé, et ton repos entre les séries. Si ça dure 2 séances, allège de 10 %.</p>`;
  if(se.length>=2)h+=`<h4>${isLest?"Performance (reps totales, lest compris)":"Force estimée (1RM estimé, kg)"}</h4><div class="chart" id="pchart"></div>${isLest?"":`<p class="hint">Juste après une montée de charge, la courbe baisse souvent un peu : c’est normal, l’estimation est moins précise au-delà de 10 reps.</p>`}`;
  h+=se.length?`<h4>Historique</h4><table class="tbl hist"><thead><tr><th>Date</th><th>Charge</th><th>Reps</th><th>RIR</th></tr></thead><tbody>${se.slice().reverse().map(p=>`<tr><td>${fd(p.date)}</td><td>${isLest&&!(+p.x.w)?"PDC":num(+p.x.w)+" kg"}</td><td>${p.x.s.join("-")}</td><td>${p.x.rir==null?"–":p.x.rir>=4?"4+":p.x.rir}</td></tr>`).join("")}</tbody></table>`:`<p class="hint">Pas encore de séance enregistrée sur cet exercice.</p>`;
  h+=`<button class="btn ghost" data-fiche="${id}">Voir la fiche technique</button>`;
  $("#mbody").innerHTML=h;const m=$("#modal");m.classList.add("open");document.body.classList.add("lock");$(".sheet",m).scrollTop=0;
  if(se.length>=2)mountChart($("#pchart"),se.map(p=>({d:p.date,y:isLest?p.sc:p.sc,tip:`${fd(p.date)} · ${perfTxt(id,p.x)}${isLest?"":` · 1RM est. ${num(Math.round(p.sc*10)/10)} kg`}`})),isLest?"":" kg");}

/* ---------- Graphique (une série, survol) ---------- */
function mountChart(el,pts,unit){if(!el||pts.length<1)return;const W=320,H=150,L=38,R=10,T=12,B=24;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}const padv=(mx-mn)*0.12;mn-=padv;mx+=padv;
  const X=i=>L+(pts.length===1?(W-L-R)/2:i*(W-L-R)/(pts.length-1)),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const ticks=[mn+padv,(mn+mx)/2,mx-padv];
  let s=`<svg viewBox="0 0 ${W} ${H}" class="lc">${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" class="grid"/><text x="${L-5}" y="${f1(Y(v)+3)}" class="ax" text-anchor="end">${num(Math.round(v*10)/10)}</text>`).join("")}
  <text x="${L}" y="${H-6}" class="ax">${fds(pts[0].d)}</text>${pts.length>1?`<text x="${W-R}" y="${H-6}" class="ax" text-anchor="end">${fds(pts[pts.length-1].d)}</text>`:""}
  <polyline points="${pts.map((p,i)=>`${f1(X(i))},${f1(Y(p.y))}`).join(" ")}" class="ln"/>${pts.map((p,i)=>`<circle cx="${f1(X(i))}" cy="${f1(Y(p.y))}" r="4" class="pt"/>`).join("")}
  <line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/><rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip" style="display:none"></div>`;
  el.innerHTML=s;const svg=$("svg",el),tip=$(".tip",el),xh=$(".xh",el);
  const mv=ev=>{const r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width;let bi=0,bd=1e9;pts.forEach((p,i)=>{const d=Math.abs(X(i)-x);if(d<bd){bd=d;bi=i;}});
    xh.style.display="";xh.setAttribute("x1",X(bi));xh.setAttribute("x2",X(bi));tip.style.display="block";tip.innerHTML=pts[bi].tip;
    const px=X(bi)*r.width/W;tip.style.left=Math.max(0,Math.min(r.width-170,px-85))+"px";tip.style.top=(Y(pts[bi].y)*r.height/H-46)+"px";
    $$(".pt",svg).forEach((c,i)=>c.classList.toggle("on",i===bi));};
  $(".hit",svg).addEventListener("pointermove",mv);$(".hit",svg).addEventListener("pointerdown",mv);
  $(".hit",svg).addEventListener("pointerleave",()=>{tip.style.display="none";xh.style.display="none";$$(".pt",svg).forEach(c=>c.classList.remove("on"));});}

/* ---------- Vue Corps ---------- */
function corpsList(){return Object.values(S.corps).filter(c=>c&&c.date).sort((a,b)=>a.date.localeCompare(b.date));}
function corpsDue(){const l=corpsList();if(!l.length)return true;return addDays(l[l.length-1].date,30)<=today();}
function vCorps(){const l=corpsList(),last=l[l.length-1],first=l[0];
  let h=`<section class="card"><h3>Pesée du mois</h3>
  <p class="hint">Même balance, <b>le matin, à jeun, après être passé aux toilettes</b>, avant de boire. Toujours dans ces conditions, sinon une variation d’eau fausse le mois.</p>
  ${last?`<p class="due ${corpsDue()?"warnt":""}">${corpsDue()?"Pesée à faire":"Prochaine pesée"} : vers le <b>${fdl(addDays(last.date,30))}</b></p>`:""}
  <div class="frm"><label><span>Date</span><input type="date" id="c_date" value="${today()}"></label>
  <label><span>Poids (kg)</span><input type="number" inputmode="decimal" step="0.1" id="c_poids" placeholder="${last?num(last.poids):"72,0"}"></label>
  <label><span>Masse grasse (%)</span><input type="number" inputmode="decimal" step="0.1" id="c_mg" placeholder="${last&&last.mg!=null?num(last.mg):"15,0"}"></label>
  <label><span>Tour de taille (cm, facultatif)</span><input type="number" inputmode="decimal" step="0.5" id="c_taille" placeholder="au nombril"></label></div>
  <button class="btn" data-csave>Enregistrer la pesée</button><p class="hint" id="c_msg"></p></section>`;
  if(l.length){const lm=c=>c.mg!=null?c.poids*(1-c.mg/100):null;
    if(l.length>=2){const dp=last.poids-first.poids,dm=(last.mg!=null&&first.mg!=null)?last.mg-first.mg:null,dl=(lm(last)!=null&&lm(first)!=null)?lm(last)-lm(first):null,prev=l[l.length-2];
      const sg=v=>(v>0?"+":"")+num(Math.round(v*10)/10);
      h+=`<section class="card"><h3>Depuis le ${fds(first.date)}</h3><div class="kpis"><div><b>${sg(dp)} kg</b><span>poids</span></div>${dm!=null?`<div><b>${sg(dm)} pt</b><span>masse grasse</span></div>`:""}${dl!=null?`<div><b>${sg(dl)} kg</b><span>masse maigre estimée</span></div>`:""}</div>`;
      const tips=[];if(last.poids<prev.poids)tips.push("Ton poids a baissé ce mois-ci alors que ta priorité est de prendre du muscle : tu manges probablement moins que ce que tu dépenses. Ajoute une collation ou une portion de féculents.");
      if(last.mg!=null&&prev.mg!=null&&last.mg-prev.mg>=1)tips.push("Ta masse grasse a pris 1 point ou plus en un mois : réduis un peu les quantités, surtout le sucré et le gras.");
      if(!tips.length&&last.poids>=prev.poids)tips.push("Le poids monte ou se maintient : c’est cohérent avec une prise de muscle. Garde le cap.");
      h+=tips.map(t=>`<p class="adv">${t}</p>`).join("")+`<p class="hint">Masse maigre estimée = poids × (1 − masse grasse). Avec une balance à impédance, c’est une tendance, pas une mesure exacte.</p></section>`;}
    h+=`<section class="card"><h4>Poids (kg)</h4><div class="chart" id="ch_p"></div>${l.some(c=>c.mg!=null)?`<h4>Masse grasse (%)</h4><div class="chart" id="ch_m"></div>`:""}${l.some(c=>c.taille)?`<h4>Tour de taille (cm)</h4><div class="chart" id="ch_t"></div>`:""}</section>`;
    h+=`<section class="card"><h3>Historique</h3><table class="tbl hist"><thead><tr><th>Date</th><th>Poids</th><th>MG</th><th>Taille</th><th></th></tr></thead><tbody>${l.slice().reverse().map((c,i,arr)=>{const p=arr[i+1];const d=p?c.poids-p.poids:null;
      return `<tr><td>${fds(c.date)}</td><td>${num(c.poids)}${d!=null?` <small class="${d>0?"g":d<0?"r":"m"}">${d>0?"+":""}${num(Math.round(d*10)/10)}</small>`:""}</td><td>${c.mg!=null?num(c.mg)+" %":"–"}</td><td>${c.taille?num(c.taille):"–"}</td><td><button class="del" data-cdel="${c.date}">Suppr.</button></td></tr>`;}).join("")}</tbody></table></section>`;}
  return h;}
function mountCorpsCharts(){const l=corpsList();if(!l.length)return;
  mountChart($("#ch_p"),l.map(c=>({d:c.date,y:c.poids,tip:`${fd(c.date)} · ${num(c.poids)} kg`})));
  const m=l.filter(c=>c.mg!=null);if(m.length)mountChart($("#ch_m"),m.map(c=>({d:c.date,y:c.mg,tip:`${fd(c.date)} · ${num(c.mg)} %`})));
  const t=l.filter(c=>c.taille);if(t.length)mountChart($("#ch_t"),t.map(c=>({d:c.date,y:c.taille,tip:`${fd(c.date)} · ${num(c.taille)} cm`})));}

/* ---------- Vue Réglages ---------- */
function vReglages(){const st=S.config.steps,isMax=S.config.volume==="max";
  return `${volCard(isMax)}<section class="card"><h3>Début du suivi</h3><p class="hint">L’assiduité compte les lundis, mercredis et vendredis à partir de cette date. Vide = ta première séance enregistrée.</p>
  <input type="date" data-cfg="start" value="${S.config.start||""}"></section>
  <section class="card"><h3>Pas de charge</h3><p class="hint">Ce qu’on ajoute quand tu réussis 12-12-12. C’est une valeur théorique : tu saisis toujours la charge réellement mise, et c’est elle qui sert pour la suite.</p>
  <div class="frm">${[["barre","Barre (total)"],["halteres","Haltères (par haltère)"],["machine","Machine"],["poulie","Poulie"],["lest","Lest (dips, abdos)"]].map(([k,l])=>`<label><span>${l} · kg</span><input type="number" inputmode="decimal" step="0.5" min="0" data-step="${k}" value="${st[k]}"></label>`).join("")}</div></section>
  <section class="card"><h3>Mes données</h3><p class="hint">${Object.keys(S.seances).length} séance(s) et ${Object.keys(S.corps).length} pesée(s) enregistrées. ${S.mode==="db"?"Elles sont sauvegardées dans la base de l’app : je peux les relire quand tu me demandes une analyse.":S.mode==="device"?`Elles sont enregistrées <b>sur ce téléphone uniquement</b>. Fais une sauvegarde de temps en temps (au moins une fois par mois) : si tu supprimes l’app ou changes de téléphone, c’est ta seule copie.${S.config.lastBackup?` Dernière sauvegarde : ${fdl(S.config.lastBackup)}.`:" Aucune sauvegarde pour l’instant."}`:"Mode test : rien n’est sauvegardé."}</p>${S.mode==="device"?`<button class="btn" data-dl>Télécharger une sauvegarde (.json)</button>`:""}
  <button class="btn ghost" data-export>Copier toutes mes données (JSON)</button><textarea id="exp" class="exp" readonly style="display:none"></textarea></section>
  <section class="card"><h3>Importer des données</h3><p class="hint">Colle ici une sauvegarde (le texte copié avec « Copier toutes mes données ») ou choisis un fichier .json. Les séances et pesées s’ajoutent à celles déjà présentes ; en cas de doublon sur une date, c’est la sauvegarde qui gagne.</p>
  <textarea id="imp" class="exp" placeholder='{"seances":{…},"corps":{…},"config":{…}}'></textarea><input type="file" id="impf" accept="application/json,.json" style="margin-top:8px">
  <button class="btn ghost" data-import>Importer</button><p class="hint" id="impmsg"></p></section>
  <section class="card"><h3>À propos</h3><p class="hint">Programme full body 3 séances (lundi, mercredi, vendredi), 3 séries par exercice, double progression 8 → 12.</p><p class="credit">${CREDIT} Les autres schémas sont dessinés pour l’app.</p></section>`;}

function volCard(isMax){
  const add=k=>PROG_MAX[k].items.filter(id=>!PROG[k].items.includes(id)).map(id=>EX[id].short);
  const rows=VOL.base.map((r,i)=>`<tr><td>${r[0]}</td><td class="rt">${r[1]}</td><td class="rt ${isMax?"hi":""}">${VOL.max[i][1]}</td></tr>`).join("");
  return `<section class="card vol ${isMax?"on":""}"><h3>Volume des séances</h3>
  <div class="seg yn"><button data-vol="base" class="${!isMax?"on yes":""}">Standard</button><button data-vol="max" class="${isMax?"on yes":""}">Volume maximal</button></div>
  <p class="hint">${isMax?"<b>Volume maximal activé.</b> Tes séances affichent les exercices ajoutés. Ton historique et tes cibles sont conservés.":"Le volume maximal ajoute des exercices (toujours 3 séries, même règle 8 → 12) pour viser environ <b>12 séries par muscle et par semaine</b>. Conseil : active-le après 4 à 6 semaines en standard, quand tes charges et ta technique sont calées."}</p>
  <table class="tbl"><thead><tr><th>Séries / semaine</th><th class="rt">Standard</th><th class="rt">Max</th></tr></thead><tbody>${rows}
  <tr><td><b>Durée d’une séance</b></td><td class="rt">≈1 h 15</td><td class="rt ${isMax?"hi":""}">≈1 h 30</td></tr><tr><td><b>Exercices par séance</b></td><td class="rt">7–8 + abdos</td><td class="rt ${isMax?"hi":""}">11 + abdos</td></tr></tbody></table>
  <h4>Ce qui s’ajoute</h4><ul class="rules">${["lun","mer","ven"].map(k=>`<li><b>${PROG[k].label}</b> : ${add(k).join(", ")}</li>`).join("")}</ul>
  <p class="hint">Si tu sens que tu ne récupères plus (charges qui baissent sur plusieurs exercices, courbatures qui durent plus de 48 h, sommeil moins bon), repasse en standard une semaine.</p></section>`;}

/* ---------- Événements ---------- */
function onClick(ev){const t=ev.target.closest("button,[data-close],.modal");if(!t)return;const d=t.dataset;
  if(t.classList.contains("modal")&&ev.target===t){closeModal();return;}
  if(d.close!==undefined){closeModal();return;}
  if(d.nav){go(d.nav);return;}
  if(d.fiche){openFiche(d.fiche);return;}
  if(d.perf){openPerf(d.perf);return;}
  if(d.dnav){if(S.dirty)saveDraft();S.date=stepPlanned(S.date,+d.dnav);S.draft=null;renderView();return;}
  if(d.today!==undefined){if(S.dirty)saveDraft();S.date=today();S.draft=null;renderView();return;}
  if(d.goto){if(S.view==="seance"&&S.dirty)saveDraft();S.date=d.goto;S.draft=null;if(S.view!=="seance")go("seance");else renderView();return;}
  if(d.prog){S.draft.prog=d.prog;saveDraftSoon();renderView();return;}
  if(d.done){S.draft.done=d.done==="1";if(!S.draft.done)S.draft.ex=S.draft.ex||{};saveDraftSoon();renderView();return;}
  if(d.reason){S.draft.reason=S.draft.reason===d.reason?null:d.reason;saveDraftSoon();$$("[data-reason]").forEach(b=>b.classList.toggle("on",b.dataset.reason===S.draft.reason));return;}
  if(d.rir){const card=t.closest(".ex"),id=card.dataset.id,x=S.draft.ex[id]||(S.draft.ex[id]={});const r=+d.rir;x.rir=x.rir===r?null:r;
    $$("[data-rir]",card).forEach(b=>b.classList.toggle("on",+b.dataset.rir===x.rir));readCard(card);return;}
  if(d.vol){S.config.volume=d.vol;writeDoc("config/main",structuredClone(S.config));renderView();return;}
  if(d.mv){showMove(t.closest('[data-mvid]').dataset.mvid,d.mv);return;}
  if(d.ptab){S.progTab=d.ptab;renderView();return;}
  if(d.filt){S.filt=d.filt;renderView();return;}
  if(d.csave!==undefined){saveCorps();return;}
  if(d.cdel){if(t.dataset.arm){delete S.corps[d.cdel];writeDoc("corps/"+d.cdel,null);renderView();}else{t.dataset.arm="1";t.textContent="Confirmer ?";t.classList.add("arm");setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent="Suppr.";t.classList.remove("arm");}},3000);}return;}
  if(d.dl!==undefined){const txt=JSON.stringify({seances:S.seances,corps:S.corps,config:S.config},null,1);const u=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
    const ln=document.createElement("a");ln.href=u;ln.download=`salle-sauvegarde-${today()}.json`;document.body.appendChild(ln);ln.click();ln.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
    S.config.lastBackup=today();writeDoc("config/main",structuredClone(S.config));t.textContent="Sauvegarde téléchargée ✓";return;}
  if(d.import!==undefined){doImport();return;}
  if(d.export!==undefined){const txt=JSON.stringify({seances:S.seances,corps:S.corps,config:S.config},null,1);const ta=$("#exp");ta.value=txt;ta.style.display="block";
    try{navigator.clipboard.writeText(txt).then(()=>{t.textContent="Copié ✓";},()=>{t.textContent="Sélectionne le texte ci-dessous";ta.select();});}catch(e){ta.select();}return;}
}
function onInput(ev){const t=ev.target;
  if(t.matches("[data-goal],[data-gbody],[data-gdate]")){onGoalInput(t);return;}
  if(t.matches(".ex input[type=number]")){readCard(t.closest(".ex"));return;}
  if(t.matches("[data-note]")){S.draft.note=t.value;saveDraftSoon();return;}
  if(t.matches("[data-reg]")){const id=t.dataset.reg,v=t.value.trim();if(v)S.config.reglages[id]=v;else delete S.config.reglages[id];saveConfigSoon();return;}
  if(t.matches("[data-step]")){const v=parseFloat(t.value);if(Number.isFinite(v)&&v>=0){S.config.steps[t.dataset.step]=v;saveConfigSoon();}return;}
}
function onChange(ev){const t=ev.target;
  if(t.id==="dpick"&&t.value){if(S.dirty)saveDraft();S.date=t.value;S.draft=null;renderView();return;}
  if(t.matches("[data-f=skip]")){readCard(t.closest(".ex"));return;}
  if(t.matches("[data-cfg=start]")){S.config.start=t.value||null;saveConfigSoon();return;}
}
function saveCorps(){const date=$("#c_date").value,p=parseFloat($("#c_poids").value),mg=parseFloat($("#c_mg").value),ta=parseFloat($("#c_taille").value),msg=$("#c_msg");
  if(!date||!Number.isFinite(p)||p<30||p>250){msg.textContent="Indique au moins la date et un poids valide.";msg.className="hint warnt";return;}
  const doc={date,poids:p,mg:Number.isFinite(mg)?mg:null,taille:Number.isFinite(ta)?ta:null,upd:Date.now()};
  S.corps[date]=doc;writeDoc("corps/"+date,doc);renderView();}
window.addEventListener("pagehide",()=>{if(S.dirty)saveDraft();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.dirty)saveDraft();});
init();
</script></body></html>
